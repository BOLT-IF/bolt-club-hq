name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast gate. The job name "ci" is kept so the existing required check keeps matching.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Postgres for Worker/API tests against a real database (PLAN §13).
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: club_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/club_test
    steps:
      - uses: actions/checkout@v4
        with:
          # The Owns check diffs against the base branch, so it needs history.
          fetch-depth: 0

      - name: Test the CI scripts (fixtures)
        run: bash scripts/ci/test/run.sh

      - name: Owns-path check
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > "$RUNNER_TEMP/changed.txt"
          # Branch convention: story/<id>-<slug>, e.g. story/s0.5-ci-deploy -> S0.5.
          # Only the leading "s" is upper-cased: story/s6.5a-x -> S6.5a, matching the STORIES.md heading.
          story="$(printf '%s' "$GITHUB_HEAD_REF" | sed -nE 's#^story/s([0-9]+\.[0-9]+[a-z]?)-.*#S\1#p')"
          if [ -z "$story" ]; then
            echo "Branch '$GITHUB_HEAD_REF' is not story/<id>-<slug>; no Owns list to enforce."
            exit 0
          fi
          bash scripts/ci/check-owns.sh docs/STORIES.md "$story" "$RUNNER_TEMP/changed.txt"

      - name: Single migration chain
        run: bash scripts/ci/check-migrations.sh db/migrations

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Test
        run: npm test

  # Playwright sharded across 4 runners, same pattern as BOLT-IF/roster-generator.
  # Each shard is a full runner with its own Postgres and browsers, so the union is the suite.
  e2e-tests:
    name: e2e-tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ci]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: club_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/club_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        # Capped at 10 minutes. A stalled CDN download once hung this step for 25+ minutes.
        # webkit is needed: playwright.config.ts's iPhone project runs on WebKit.
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright suite (shard ${{ matrix.shard }}/4)
        run: npx playwright test --shard=${{ matrix.shard }}/4

  # Summary gate named "e2e-tests", so a branch protection rule on that name matches the
  # sharded pipeline (same trick as roster-generator). Green only when every shard is green.
  e2e-summary:
    name: e2e-tests
    needs: [e2e-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All shards must pass
        run: |
          if [ "${{ needs.e2e-tests.result }}" != "success" ]; then
            echo "e2e shard matrix result: ${{ needs.e2e-tests.result }}"
            exit 1
          fi
