name: Deploy

# PLAN §11.1 and S0.5: on merge to main, `wrangler deploy`, then the database migrations,
# then a smoke test. Nothing deploys until Ashok adds the secrets listed in docs/ops/secrets.md.
# While they are missing, each step skips with a notice, so CI stays green.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: check deploy secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.guard.outputs.ready }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      # Writes ready=true|false to GITHUB_OUTPUT. A skip still exits 0, so never gate on the exit code.
      - id: guard
        run: bash scripts/ci/require-secrets.sh deploy

  deploy:
    name: wrangler deploy, migrate, smoke
    needs: [preflight]
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the SPA
        run: npm run build

      - name: Deploy the Worker (wrangler deploy)
        run: npx wrangler deploy

      # Migrations run AFTER the Worker is live. Expand-only migrations keep the previous
      # Worker version working during the gap. drizzle-kit reads DATABASE_URL.
      - name: Apply database migrations
        run: npx drizzle-kit migrate

      - name: Smoke test the deployed Worker
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          if [ -z "${PUBLIC_BASE_URL:-}" ]; then
            echo "PUBLIC_BASE_URL repo variable is not set; cannot smoke test." >&2
            exit 1
          fi
          bash scripts/ci/smoke.sh "$PUBLIC_BASE_URL"

  skipped-notice:
    name: deploy skipped notice
    needs: [preflight]
    if: needs.preflight.outputs.ready != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Deploy skipped until the secrets in docs/ops/secrets.md are set."
