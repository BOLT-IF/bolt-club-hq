name: Deploy

# PLAN §11.1 and S0.5: Cloudflare Workers Builds deploys `main` directly; on push to main,
# GitHub Actions runs database migrations (`npx drizzle-kit migrate`, using `DATABASE_URL`)
# and then the smoke test (`scripts/ci/smoke.sh`, using `PUBLIC_BASE_URL`). Nothing runs until
# Ashok adds the `DATABASE_URL` secret listed in docs/ops/secrets.md. While it is missing,
# this workflow skips with a notice, so CI stays green.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: check deploy secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.guard.outputs.ready }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      # Writes ready=true|false to GITHUB_OUTPUT. A skip still exits 0, so never gate on the exit code.
      - id: guard
        run: bash scripts/ci/require-secrets.sh deploy

  deploy:
    name: migrate and smoke
    needs: [preflight]
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Cloudflare Workers Builds deploys the Worker on push to `main`. Expand-only migrations
      # keep the previous Worker version working during the gap. drizzle-kit reads DATABASE_URL.
      - name: Apply database migrations
        run: npx drizzle-kit migrate

      - name: Smoke test the deployed Worker
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          if [ -z "${PUBLIC_BASE_URL:-}" ]; then
            echo "PUBLIC_BASE_URL repo variable is not set; cannot smoke test." >&2
            exit 1
          fi
          bash scripts/ci/smoke.sh "$PUBLIC_BASE_URL"

  skipped-notice:
    name: deploy skipped notice
    needs: [preflight]
    if: needs.preflight.outputs.ready != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Deploy skipped until the secrets in docs/ops/secrets.md are set."
