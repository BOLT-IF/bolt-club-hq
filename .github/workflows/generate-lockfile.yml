name: Generate lockfile

# One-shot bootstrap: this machine cannot produce a valid package-lock.json
# (npm 11 writes it without resolved/integrity and the local network blocks
# registry.npmjs.org). GitHub's runner has clean npm access, so it regenerates
# the lockfile and commits it back. Put dependency changes on a `deps/<slug>`
# branch (triggers automatically) or run it by hand:
# `gh workflow run generate-lockfile.yml --ref <branch>`. No-op when in sync.

on:
  push:
    branches: ["deps/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    name: regenerate package-lock.json if invalid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Updates the existing lockfile in place: only what package.json changed is
      # re-resolved. Deleting it first re-resolved every package and silently
      # bumped unrelated tools (typescript-eslint 8.73 -> 8.74 broke lint on #12).
      - name: Update lockfile (npm 11, clean registry access)
        run: |
          npm install -g npm@11
          npm install --package-lock-only --registry=https://registry.npmjs.org/

      - name: Commit and push if the lockfile changed
        run: |
          git config user.name "lockfile-bot"
          git config user.email "actions@github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already present and unchanged."
          else
            git commit -m "chore: canonical package-lock.json (generated on CI runner)"
            git push
          fi
