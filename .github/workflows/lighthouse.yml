name: Monthly Lighthouse

# PLAN §13 "Scheduled": a monthly Lighthouse audit of the deployed app. It prints the scores to
# the job log and keeps the HTML reports as an artifact. It does not publish them publicly.
# Secret: LHCI_TARGET_URL (the public origin, e.g. https://bolt-club-hq.<account>.workers.dev).

on:
  schedule:
    # 2nd of the month, 06:00 UTC.
    - cron: "0 6 2 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    name: lighthouse audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LHCI_TARGET_URL: ${{ secrets.LHCI_TARGET_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets (skips until they exist)
        id: guard
        # Writes ready=true|false to GITHUB_OUTPUT. A skip still exits 0, so never gate on the exit code.
        run: bash scripts/ci/require-secrets.sh lighthouse

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Run Lighthouse CI against the deployed origin
        if: steps.guard.outputs.ready == 'true'
        run: npx --yes @lhci/cli@0.15 collect --url="$LHCI_TARGET_URL" --numberOfRuns=3 --outputDir=lhci-reports

      - name: Keep the Lighthouse reports
        if: steps.guard.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lhci-reports
          retention-days: 90
