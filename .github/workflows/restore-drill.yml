name: Monthly restore drill

# A backup that has never been restored is not a backup. Restores the latest encrypted dump
# into a throwaway database and runs a smoke query (scripts/ci/restore-drill.sh).
# Secrets: DATABASE_URL, RESTORE_TARGET_URL, BACKUP_ENCRYPTION_KEY, plus the dump source.

on:
  schedule:
    # 1st of the month, 05:00 UTC.
    - cron: "0 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drill:
    name: restore latest dump
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESTORE_TARGET_URL: ${{ secrets.RESTORE_TARGET_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets (skips until they exist)
        id: guard
        # Writes ready=true|false to GITHUB_OUTPUT. A skip still exits 0, so never gate on the exit code.
        run: bash scripts/ci/require-secrets.sh restore-drill

      # The client major must be >= the server's (Neon runs 18): pg_dump refuses a newer server.
      - name: Install PostgreSQL client 18
        if: steps.guard.outputs.ready == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      # The dumps live in the backup bucket. Fetch the latest into a local folder first.
      - name: Fetch latest encrypted dump
        if: steps.guard.outputs.ready == 'true'
        env:
          BACKUP_BUCKET_TOKEN: ${{ secrets.BACKUP_BUCKET_TOKEN }}
        run: |
          echo "TODO(ops): download the newest bolt-club-hq-*.sql.enc from the backup store into \$RUNNER_TEMP/dumps." >&2
          echo "Until the off-site store is chosen (docs/ops/backups.md), this step fails the drill." >&2
          exit 1

      - name: Restore and smoke query
        if: steps.guard.outputs.ready == 'true'
        run: bash scripts/ci/restore-drill.sh "$RUNNER_TEMP/dumps"
